function showCommands(){content.append(header('Commands','Reference for public, staff, and owner commands found in the USOTF bot source.'));const toolbar=el('div','toolbar'),search=el('input','input');search.placeholder='Search commands';search.setAttribute('aria-label','Search commands');const select=el('select','input');select.style.maxWidth='180px';for(const v of ['All','Public','Staff','Owner']){const o=el('option','',v);o.value=v;select.append(o)}toolbar.append(search,select);const grid=el('div','catalog');function render(){grid.replaceChildren();for(const x of commands.filter(x=>(select.value==='All'||select.value===x.permission)&&x.name.toLowerCase().includes(search.value.toLowerCase()))){const c=el('div','command');add(c,el('small','',x.permission),el('strong','','/'+x.name));grid.append(c)}}search.oninput=render;select.onchange=render;render();content.append(toolbar,grid)}
