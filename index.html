function authApiBase(){return String(window.DESTINY_API_URL||'').trim().replace(/\/+$/,'')}
function showLoginNotice(heading,message){
 const existing=document.getElementById('login-notice');if(existing)existing.remove();
 const n=el('div','login-notice');n.id='login-notice';n.setAttribute('role','alert');
 add(n,el('strong','',heading),el('p','',message));
 const close=el('button','login-close','✕');close.setAttribute('aria-label','Dismiss notice');close.onclick=()=>n.remove();
 n.append(close);document.body.append(n);
}
async function authApi(path,opts={}){
 const base=authApiBase();if(!/^https:\/\//.test(base))throw Error('Destiny authentication service is not deployed yet.');
 const headers={'Accept':'application/json',...opts.body?{'Content-Type':'application/json'}:{},...(sessionToken?{'Authorization':'Bearer '+sessionToken}:{})};
 const response=await fetch(base+'/api'+path,{...opts,headers:{...headers,...opts.headers},cache:'no-store'});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'Server request failed ('+response.status+').');
 return data;
}
function updateIdentity(){
 const top=document.getElementById('connect');
 top.textContent=currentUser?'Logout · '+(currentUser.globalName||currentUser.username):'Login with Discord';
 top.onclick=currentUser?logoutDiscord:loginDiscord;
 const selected=document.querySelector('.server-select');
 if(selected){
  const name=selected.querySelector('strong'),sub=selected.querySelector('small');
  name.textContent=selectedGuild?selectedGuild.name:'Select a server';
  sub.textContent=selectedGuild?'Configure this server':currentUser?'Your Discord servers':'Discord login required';
 }
 const avatar=document.querySelector('.avatar');
 if(avatar)avatar.textContent=currentUser?((currentUser.globalName||currentUser.username||'D')[0].toUpperCase()):'D';
}
function installDestiny(guildId=''){
 const id=applicationId||window.DESTINY_APPLICATION_ID||'1388987529537126500';
 if(!/^\d{17,22}$/.test(id)){showLoginNotice('Invalid application','Destiny bot application ID was not configured correctly.');return}
 const params=new URLSearchParams({client_id:id,scope:'bot applications.commands'});
 if(guildId){params.set('guild_id',guildId);params.set('disable_guild_select','true')}
 window.open('https://discord.com/oauth2/authorize?'+params.toString(),'_blank','noopener,noreferrer');
}
function loginDiscord(){
 const base=authApiBase();
 if(!/^https:\/\//.test(base)){
  showLoginNotice('Discord login needs activation','The secure Destiny API must be deployed and its public URL configured. The bot application credentials remain private on that server.');
  return;
 }
 window.location.assign(base+'/api/auth/discord');
}
async function logoutDiscord(){
 try{if(sessionToken)await authApi('/auth/logout',{method:'POST'})}catch{}
 sessionToken='';sessionStorage.removeItem('destiny_session');sessionStorage.removeItem('destiny_guild');
 currentUser=null;managedGuilds=[];selectedGuild=null;botConnected=false;authError='';
 updateIdentity();go('My Servers');
}
async function initAuth(){
 const uri=new URL(location.href),ticket=uri.searchParams.get('destiny_ticket'),loginError=uri.searchParams.get('destiny_error');
 if(ticket||loginError){
  uri.searchParams.delete('destiny_ticket');uri.searchParams.delete('destiny_error');
  history.replaceState(null,'',uri.pathname+uri.search+uri.hash);
 }
 if(loginError)authError=loginError;
 if(ticket){
  try{const data=await authApi('/auth/exchange',{method:'POST',body:JSON.stringify({ticket})});
   sessionToken=data.session;sessionStorage.setItem('destiny_session',sessionToken);currentUser=data.user;
  }catch(e){authError=e.message||'Discord sign-in failed.'}
 }
 if(sessionToken){
  try{
   const data=await authApi('/auth/me');currentUser=data.user;
   const result=await authApi('/guilds');
   managedGuilds=Array.isArray(result.guilds)?result.guilds:[];botConnected=Boolean(result.botConnected);
   applicationId=result.applicationId||applicationId;
   const last=sessionStorage.getItem('destiny_guild');
   selectedGuild=managedGuilds.find(g=>g.installed===true&&g.id===last)||null;
  }catch(e){
   authError=e.message||'Could not retrieve your Discord servers.';
   if(/log in|401|expired/i.test(authError)){sessionToken='';sessionStorage.removeItem('destiny_session');currentUser=null}
  }
 }
 authLoading=false;updateIdentity();go(current);
 if(authError)showLoginNotice('Discord connection',authError);
}
function guildIcon(guild){

 return avatar;
}
