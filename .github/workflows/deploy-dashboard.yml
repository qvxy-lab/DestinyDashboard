name: Deploy Destiny Dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp destiny-config.js _site/destiny-config.js
          touch _site/.nojekyll
      - name: Set public authentication API URL
        env:
          DESTINY_API_URL: ${{ vars.DESTINY_API_URL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          url = os.getenv('DESTINY_API_URL', '').strip().rstrip('/')
          if url and not url.startswith('https://'):
              raise SystemExit('DESTINY_API_URL must use HTTPS')
          pathlib.Path('_site/destiny-config.js').write_text(
              'window.DESTINY_API_URL = ' + json.dumps(url) + ';\\n',
              encoding='utf-8'
          )
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
